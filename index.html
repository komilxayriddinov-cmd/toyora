              <div class="lg:col-span-6 space-y-4">
                <div class="aspect-square rounded-3xl overflow-hidden bg-sand border border-borderwarm">
                  <img src="${p.images[this.state.activeImageIdx] || p.images[0]}" alt="${p.name[lang]}" class="w-full h-full object-cover" />
                </div>
                ${p.images.length > 1 ? `
                  <div class="flex gap-3">
                    ${p.images.map((img, idx) => `
                      <button onclick="app.state.activeImageIdx=${idx}; app.renderPage();" class="w-20 h-20 rounded-2xl overflow-hidden border-2 transition-all ${this.state.activeImageIdx === idx ? 'border-terracotta scale-105' : 'border-transparent opacity-70'}">
                        <img src="${img}" alt="" class="w-full h-full object-cover" />
                      </button>
                    `).join('')}
                  </div>
                ` : ''}
              </div>

              <!-- Product Specs & Add to Cart -->
              <div class="lg:col-span-6 space-y-6">
                <div>
                  <div class="flex items-center gap-3 text-xs text-charcoal/60 mb-2">
                    <span>${t.product.sku}: ${p.sku}</span>
                    <span>•</span>
                    <span class="flex items-center gap-1 text-terracotta font-bold">
                      <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i> ${p.rating.toFixed(1)}
                    </span>
                  </div>
                  <h1 class="font-serif text-3xl sm:text-4xl font-semibold text-charcoal">${p.name[lang]}</h1>
                  <div class="flex items-baseline gap-3 mt-4">
                    <span class="text-2xl font-bold text-charcoal">${this.formatUZS(p.price)}</span>
                    ${p.oldPrice ? `<span class="text-sm text-charcoal/50 line-through">${this.formatUZS(p.oldPrice)}</span>` : ''}
                  </div>
                </div>

                <p class="text-sm sm:text-base text-charcoal/80 leading-relaxed">${p.desc[lang]}</p>

                <div>
                  <span class="block text-xs font-bold uppercase tracking-wider text-charcoal/65 mb-2">${t.product.skills}</span>
                  <div class="flex flex-wrap gap-2">
                    ${p.skills[lang].map((sk) => `<span class="px-3.5 py-1.5 rounded-full bg-sage/25 text-xs font-bold text-charcoal">${sk}</span>`).join('')}
                  </div>
                </div>

                <div class="bg-sand rounded-2xl p-5 border border-borderwarm space-y-2.5 text-xs">
                  <div class="flex justify-between py-1 border-b border-borderwarm">
                    <span class="text-charcoal/65">${t.product.ageRec}:</span>
                    <span class="font-bold">${t.ages.groups[p.ageGroup]?.label}</span>
                  </div>
                  <div class="flex justify-between py-1 border-b border-borderwarm">
                    <span class="text-charcoal/65">${t.product.dimensions}:</span>
                    <span class="font-bold">${p.dimensions}</span>
                  </div>
                  <div class="flex justify-between py-1 border-b border-borderwarm">
                    <span class="text-charcoal/65">${t.product.stock}:</span>
                    <span class="font-bold text-sage">${p.stock} ${t.product.pcs}</span>
                  </div>
                  <div class="pt-1">
                    <span class="text-charcoal/65 block mb-1">${t.product.materials}:</span>
                    <span class="font-semibold text-charcoal">${p.materials[lang]}</span>
                  </div>
                </div>

                <div class="flex flex-wrap items-center gap-4 pt-2">
                  <div class="flex items-center bg-sand border border-borderwarm rounded-2xl px-3 py-2">
                    <button onclick="app.state.productDetailQty = Math.max(1, app.state.productDetailQty - 1); app.renderPage();" class="p-1.5 hover:text-terracotta"><i data-lucide="minus" class="w-4 h-4"></i></button>
                    <span class="px-4 font-bold text-sm">${this.state.productDetailQty}</span>
                    <button onclick="app.state.productDetailQty += 1; app.renderPage();" class="p-1.5 hover:text-terracotta"><i data-lucide="plus" class="w-4 h-4"></i></button>
                  </div>

                  <button onclick="app.addToCart('${p.id}', app.state.productDetailQty)" class="flex-1 py-4 px-6 rounded-2xl bg-charcoal hover:bg-terracotta text-cream text-xs font-bold uppercase tracking-wider transition-all flex items-center justify-center gap-2">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>${t.shop.addToCart} — ${this.formatUZS(p.price * this.state.productDetailQty)}</span>
                  </button>

                  <button onclick="app.toggleFavorite('${p.id}')" class="p-4 rounded-2xl border ${isFav ? 'bg-terracotta text-white border-terracotta' : 'border-borderwarm hover:bg-sand'}">
                    <i data-lucide="heart" class="w-5 h-5 ${isFav ? 'fill-current' : ''}"></i>
                  </button>
                </div>

                <div class="flex items-center gap-2.5 text-xs text-charcoal/80 bg-butter/40 p-3.5 rounded-xl border border-gold/30">
                  <i data-lucide="truck" class="w-4 h-4 text-terracotta shrink-0"></i>
                  <span>${t.product.deliveryNote}</span>
                </div>
              </div>
            </div>

            <!-- Item Reviews -->
            <div class="mt-16 pt-12 border-t border-borderwarm">
              <h2 class="font-serif text-2xl font-semibold mb-6">${t.product.reviewsTitle} (${itemReviews.length})</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${itemReviews.map((r) => `
                  <div class="bg-sand p-5 rounded-2xl border border-borderwarm">
                    <div class="flex justify-between mb-2">
                      <span class="font-bold text-sm">${r.author} (${r.city})</span>
                      <span class="text-terracotta font-bold">${'★'.repeat(r.rating)}</span>
                    </div>
                    <p class="text-xs text-charcoal/80 leading-relaxed">${r.comment}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            ${related.length > 0 ? `
              <div class="mt-14 pt-10 border-t border-borderwarm">
                <h2 class="font-serif text-2xl font-semibold mb-6">${t.product.relatedTitle}</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  ${related.map((rp) => this.renderProductCardHTML(rp)).join('')}
                </div>
              </div>
            ` : ''}
          </main>
        `;
      },

      // ==========================================
      // VIEW 5: FAVORITES / WISHLIST
      // ==========================================
      viewFavorites() {
        const t = this.t();
        const favItems = CATALOG.filter((p) => this.state.favorites.includes(p.id));
        return `
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <h1 class="font-serif text-4xl font-semibold text-charcoal mb-8">Wishlist (${favItems.length})</h1>
            ${favItems.length === 0 ? `
              <div class="bg-sand rounded-3xl p-12 text-center border border-borderwarm">
                <p class="text-base text-charcoal/70 mb-4">${t.cart.emptyDesc}</p>
                <button onclick="app.navigate('shop')" class="px-6 py-3 rounded-xl bg-charcoal text-cream text-xs font-bold uppercase">${t.cart.continueBtn}</button>
              </div>
            ` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                ${favItems.map((p) => this.renderProductCardHTML(p)).join('')}
              </div>
            `}
          </main>
        `;
      },

      // ==========================================
      // VIEW 6: DEDICATED SHOPPING CART PAGE
      // ==========================================
      viewCart() {
        const t = this.t();
        const lang = this.state.lang;
        const { items, subtotal, discount, shipping, total } = this.getTotals();

        return `
          <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <h1 class="font-serif text-4xl font-semibold text-charcoal mb-8">${t.cart.title}</h1>
            ${items.length === 0 ? `
              <div class="bg-sand rounded-3xl p-12 text-center border border-borderwarm space-y-4">
                <p class="font-serif text-2xl">${t.cart.empty}</p>
                <p class="text-sm text-charcoal/65">${t.cart.emptyDesc}</p>
                <button onclick="app.navigate('shop')" class="px-6 py-3.5 rounded-xl bg-charcoal text-cream text-xs font-bold uppercase">${t.cart.continueBtn}</button>
              </div>
            ` : `
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-7 space-y-4">
                  ${items.map((item) => `
                    <div class="flex items-center gap-4 bg-sand p-4 rounded-2xl border border-borderwarm">
                      <img src="${item.images[0]}" alt="${item.name[lang]}" class="w-24 h-24 rounded-xl object-cover shrink-0" />
                      <div class="flex-1 min-w-0">
                        <h3 onclick="app.navigate('product', { productId: '${item.id}' })" class="font-serif text-lg font-semibold cursor-pointer hover:text-terracotta">${item.name[lang]}</h3>
                        <p class="text-xs text-charcoal/60">${item.sku}</p>
                        <div class="text-sm font-bold text-terracotta mt-1">${this.formatUZS(item.price)}</div>
                      </div>
                      <div class="flex items-center bg-cream rounded-xl border border-borderwarm px-2.5 py-1.5">
                        <button onclick="app.updateCartQty('${item.id}', -1)" class="p-1"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button>
                        <span class="px-3 text-xs font-bold">${item.qty}</span>
                        <button onclick="app.updateCartQty('${item.id}', 1)" class="p-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
                      </div>
                      <button onclick="app.removeFromCart('${item.id}')" class="p-2 text-charcoal/50 hover:text-red-600">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  `).join('')}
                </div>

                <div class="lg:col-span-5">
                  <div class="bg-sand p-6 rounded-3xl border border-borderwarm space-y-4">
                    <div class="flex gap-2">
                      <input id="page-promo-input" type="text" placeholder="${t.cart.promoPlaceholder}" class="flex-1 px-4 py-3 rounded-xl bg-cream border border-borderwarm text-xs" />
                      <button onclick="app.applyPromo(document.getElementById('page-promo-input').value)" class="px-5 py-3 rounded-xl bg-charcoal text-cream text-xs font-bold uppercase">${t.cart.apply}</button>
                    </div>
                    ${this.state.promoMessage ? `<p class="text-xs font-bold ${this.state.promoApplied ? 'text-sage' : 'text-terracotta'}">${this.state.promoMessage}</p>` : ''}
                    <div class="space-y-2 text-xs pt-2 border-t border-borderwarm">
                      <div class="flex justify-between">
                        <span class="text-charcoal/70">${t.cart.subtotal}</span>
                        <span class="font-bold">${this.formatUZS(subtotal)}</span>
                      </div>
                      ${this.state.promoApplied ? `
                      <div class="flex justify-between text-sage font-bold">
                        <span>${t.cart.discount}</span>
                        <span>-${this.formatUZS(discount)}</span>
                      </div>` : ''}
                      <div class="flex justify-between">
                        <span class="text-charcoal/70">${t.cart.shipping}</span>
                        <span class="font-bold">${shipping === 0 ? t.cart.free : this.formatUZS(shipping)}</span>
                      </div>
                      <div class="flex justify-between text-base font-bold pt-2 border-t border-borderwarm">
                        <span>${t.cart.total}</span>
                        <span>${this.formatUZS(total)}</span>
                      </div>
                    </div>
                    <button onclick="app.navigate('checkout')" class="w-full py-4 rounded-2xl bg-charcoal hover:bg-terracotta text-cream text-xs font-bold uppercase tracking-wider transition-all">
                      ${t.cart.checkoutBtn}
                    </button>
                  </div>
                </div>
              </div>
            `}
          </main>
        `;
      },

      // ==========================================
      // VIEW 7: UZBEKISTAN CHECKOUT & ORDER CONFIRMATION
      // ==========================================
      viewCheckout() {
        const t = this.t();
        const lang = this.state.lang;
        const { items, subtotal, discount, shipping, total } = this.getTotals();

        if (this.state.lastOrderReceipt) {
          const ord = this.state.lastOrderReceipt;
          return `
            <main class="max-w-2xl mx-auto px-4 py-14">
              <div class="bg-sand rounded-3xl p-8 sm:p-12 border border-borderwarm text-center space-y-5">
                <div class="w-16 h-16 rounded-full bg-sage text-white flex items-center justify-center mx-auto">
                  <i data-lucide="check-circle-2" class="w-8 h-8"></i>
                </div>
                <h1 class="font-serif text-3xl sm:text-4xl font-semibold text-charcoal">${t.checkout.successTitle}</h1>
                <p class="text-sm text-charcoal/75">${t.checkout.successDesc}</p>
                <div class="bg-cream p-5 rounded-2xl border border-borderwarm text-left text-xs space-y-2">
                  <div class="flex justify-between">
                    <span class="text-charcoal/65">${t.checkout.orderNumber}:</span>
                    <span class="font-bold text-terracotta">${ord.code}</span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-charcoal/65">${t.checkout.fullName}:</span>
                    <span class="font-bold">${ord.customer.fullName}</span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-charcoal/65">${t.checkout.phone}:</span>
                    <span class="font-bold">${ord.customer.phone}</span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-charcoal/65">Payment:</span>
                    <span class="font-bold uppercase">${ord.payment}</span>
                  </div>
                  <div class="flex justify-between pt-2 border-t border-borderwarm text-sm font-bold">
                    <span>${t.cart.total}:</span>
                    <span>${this.formatUZS(ord.total)}</span>
                  </div>
                </div>
                <button onclick="app.navigate('home')" class="px-7 py-3.5 rounded-xl bg-charcoal text-cream text-xs font-bold uppercase tracking-wider">
                  ${t.cart.continueBtn}
                </button>
              </div>
            </main>
          `;
        }

        return `
          <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="mb-8">
              <h1 class="font-serif text-4xl font-semibold text-charcoal">${t.checkout.title}</h1>
              <p class="text-sm text-charcoal/65 mt-1">${t.checkout.subtitle}</p>
            </div>

            <form onsubmit="app.submitCheckoutOrder(event)" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div class="lg:col-span-7 space-y-6">
                <!-- Step 1: Contact -->
                <div class="bg-sand p-6 rounded-3xl border border-borderwarm space-y-4">
                  <h2 class="font-serif text-xl font-semibold">${t.checkout.step1}</h2>
                  <div>
                    <label class="block text-xs font-bold text-charcoal/70 mb-1">${t.checkout.fullName} *</label>
                    <input type="text" required value="${this.state.checkout.fullName}" oninput="app.state.checkout.fullName = this.value" class="w-full px-4 py-3 rounded-xl bg-cream border border-borderwarm text-sm" />
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-bold text-charcoal/70 mb-1">${t.checkout.phone} *</label>
                      <input type="tel" required value="${this.state.checkout.phone}" oninput="this.value = app.formatPhone(this.value); app.state.checkout.phone = this.value;" class="w-full px-4 py-3 rounded-xl bg-cream border border-borderwarm text-sm font-semibold" />
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-charcoal/70 mb-1">${t.checkout.email}</label>
                      <input type="email" value="${this.state.checkout.email}" oninput="app.state.checkout.email = this.value" class="w-full px-4 py-3 rounded-xl bg-cream border border-borderwarm text-sm" />
                    </div>
                  </div>
                </div>

                <!-- Step 2: Uzbekistan Region & Delivery -->
                <div class="bg-sand p-6 rounded-3xl border border-borderwarm space-y-4">
                  <h2 class="font-serif text-xl font-semibold">${t.checkout.step2}</h2>
                  <div>
                    <label class="block text-xs font-bold text-charcoal/70 mb-1">${t.checkout.region} *</label>
                    <select onchange="app.state.checkout.region = this.value" class="w-full px-4 py-3 rounded-xl bg-cream border border-borderwarm text-sm font-semibold">
                      ${UZ_REGIONS.map((reg) => `
                        <option value="${reg.id}" ${this.state.checkout.region === reg.id ? 'selected' : ''}>${reg[lang]}</option>
                      `).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-charcoal/70 mb-1">${t.checkout.address} *</label>
                    <input type="text" required value="${this.state.checkout.address}" oninput="app.state.checkout.address = this.value" class="w-full px-4 py-3 rounded-xl bg-cream border border-borderwarm text-sm" />
                  </div>

                  <div class="space-y-2.5 pt-2">
                    ${Object.keys(t.checkout.methods).map((mk) => `
                      <label class="flex items-center justify-between p-3.5 rounded-2xl border cursor-pointer ${this.state.checkout.method === mk ? 'bg-cream border-charcoal' : 'border-borderwarm'}">
                        <div class="flex items-center gap-3">
                          <input type="radio" name="delMethod" ${this.state.checkout.method === mk ? 'checked' : ''} onchange="app.state.checkout.method='${mk}'; app.renderPage();" />
                          <span class="text-xs font-bold">${t.checkout.methods[mk].name}</span>
                        </div>
                        <span class="text-xs font-bold text-terracotta">${t.checkout.methods[mk].price}</span>
                      </label>
                    `).join('')}
                  </div>

                  <div class="pt-2 space-y-2">
                    <label class="flex items-center gap-2.5 text-xs font-bold cursor-pointer">
                      <input type="checkbox" ${this.state.checkout.giftWrap ? 'checked' : ''} onchange="app.state.checkout.giftWrap = this.checked" />
                      <span>${t.checkout.giftWrap}</span>
                    </label>
                    <input type="text" placeholder="${t.checkout.giftNote}" value="${this.state.checkout.giftNote}" oninput="app.state.checkout.giftNote = this.value" class="w-full px-3.5 py-2.5 rounded-xl bg-cream border border-borderwarm text-xs" />
                  </div>
                </div>

                <!-- Step 3: Payment Methods (Payme / Click / Uzum / COD) -->
                <div class="bg-sand p-6 rounded-3xl border border-borderwarm space-y-3">
                  <h2 class="font-serif text-xl font-semibold">${t.checkout.step3}</h2>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    ${Object.keys(t.checkout.payments).map((pk) => `
                      <label class="p-4 rounded-2xl border cursor-pointer flex flex-col justify-between ${this.state.checkout.payment === pk ? 'bg-cream border-charcoal shadow-xs' : 'border-borderwarm'}">
                        <div class="flex items-center gap-2.5">
                          <input type="radio" name="payMethod" ${this.state.checkout.payment === pk ? 'checked' : ''} onchange="app.state.checkout.payment='${pk}'; app.renderPage();" />
                          <span class="text-xs font-bold uppercase tracking-wider">${t.checkout.payments[pk].name}</span>
                        </div>
                        <p class="text-[11px] text-charcoal/65 mt-2 leading-relaxed">${t.checkout.payments[pk].desc}</p>
                      </label>
                    `).join('')}
                  </div>
                </div>
              </div>

              <!-- Summary Sidebar -->
              <div class="lg:col-span-5">
                <div class="bg-sand p-6 rounded-3xl border border-borderwarm space-y-4 sticky top-28">
                  <h3 class="font-serif text-2xl font-semibold">${t.cart.title}</h3>
                  <div class="space-y-3 max-h-64 overflow-y-auto pr-1">
                    ${items.map((item) => `
                      <div class="flex items-center gap-3 text-xs">
                        <img src="${item.images[0]}" alt="" class="w-12 h-12 rounded-xl object-cover" />
                        <div class="flex-1 min-w-0">
                          <div class="font-bold truncate">${item.name[lang]}</div>
                          <div class="text-charcoal/60">${item.qty} × ${this.formatUZS(item.price)}</div>
                        </div>
                        <div class="font-bold">${this.formatUZS(item.price * item.qty)}</div>
                      </div>
                    `).join('')}
                  </div>
                  <div class="border-t border-borderwarm pt-4 space-y-2 text-xs">
                    <div class="flex justify-between">
                      <span class="text-charcoal/70">${t.cart.subtotal}</span>
                      <span class="font-bold">${this.formatUZS(subtotal)}</span>
                    </div>
                    ${this.state.promoApplied ? `
                    <div class="flex justify-between text-sage font-bold">
                      <span>${t.cart.discount}</span>
                      <span>-${this.formatUZS(discount)}</span>
                    </div>` : ''}
                    <div class="flex justify-between">
                      <span class="text-charcoal/70">${t.cart.shipping}</span>
                      <span class="font-bold">${shipping === 0 ? t.cart.free : this.formatUZS(shipping)}</span>
                    </div>
                    <div class="flex justify-between text-base font-bold pt-2 border-t border-borderwarm">
                      <span>${t.cart.total}</span>
                      <span>${this.formatUZS(total)}</span>
                    </div>
                  </div>
                  <button type="submit" class="w-full py-4 rounded-2xl bg-charcoal hover:bg-terracotta text-cream text-xs font-bold uppercase tracking-wider transition-all">
                    ${t.checkout.placeOrderBtn}
                  </button>
                </div>
              </div>
            </form>
          </main>
        `;
      },

      submitCheckoutOrder(e) {
        e.preventDefault();
        const { items, total } = this.getTotals();
        if (items.length === 0) return;

        const orderRecord = {
          code: 'TYR-' + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toISOString().slice(0, 10),
          customer: {
            fullName: this.state.checkout.fullName,
            phone: this.state.checkout.phone,
            region: this.state.checkout.region,
            address: this.state.checkout.address
          },
          payment: this.state.checkout.payment,
          total,
          itemsCount: items.length
        };

        this.state.orders.unshift(orderRecord);
        this.state.lastOrderReceipt = orderRecord;
        this.state.cart = [];
        this.saveStorage();
        this.renderChrome();
        this.renderPage();
      },

      // ==========================================
      // VIEW 8: SPECIAL OFFERS & PROMO PAGE
      // ==========================================
      viewOffers() {
        const t = this.t();
        const saleProducts = CATALOG.filter((p) => p.oldPrice);
        return `
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="bg-gradient-to-r from-blush/50 via-sand to-butter/50 rounded-3xl p-8 sm:p-12 border border-borderwarm mb-12 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
              <div class="space-y-3 max-w-2xl">
                <span class="px-3.5 py-1 rounded-full bg-charcoal text-cream text-xs font-bold uppercase tracking-wider">${t.offers.tag}</span>
                <h1 class="font-serif text-3xl sm:text-5xl font-semibold text-charcoal">${t.offers.title}</h1>
                <p class="text-sm sm:text-base text-charcoal/75">${t.offers.subtitle}</p>
              </div>
              <button
                onclick="navigator.clipboard?.writeText('TOYORA15'); app.applyPromo('TOYORA15'); app.toast('${t.offers.copied}');"
                class="px-6 py-4 rounded-2xl bg-charcoal hover:bg-terracotta text-cream text-xs font-bold uppercase tracking-wider shrink-0 flex items-center gap-2 shadow-md"
              >
                <i data-lucide="copy" class="w-4 h-4"></i>
                <span>TOYORA15 — ${t.offers.copyBtn}</span>
              </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              ${saleProducts.map((p) => this.renderProductCardHTML(p)).join('')}
            </div>
          </main>
        `;
      },

      // ==========================================
      // VIEW 9: ABOUT US
      // ==========================================
      viewAbout() {
        const t = this.t();
        return `
          <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-14 space-y-10">
            <div class="text-center max-w-3xl mx-auto space-y-4">
              <span class="text-xs font-bold uppercase tracking-widest text-terracotta">${t.about.tag}</span>
              <h1 class="font-serif text-4xl sm:text-5xl font-semibold text-charcoal">${t.about.title}</h1>
              <p class="text-base text-charcoal/80 leading-relaxed">${t.about.p1}</p>
              <p class="text-sm text-charcoal/70 leading-relaxed">${t.about.p2}</p>
            </div>
            <img src="https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?auto=format&fit=crop&w=1400&q=85" alt="TOYORA Atelier" class="w-full h-96 object-cover rounded-3xl border border-borderwarm" />
          </main>
        `;
      },

      // ==========================================
      // VIEW 10: CONTACT & TASHKENT SHOWROOM
      // ==========================================
      viewContact() {
        const t = this.t();
        return `
          <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
              <div class="lg:col-span-6 space-y-6">
                <h1 class="font-serif text-4xl font-semibold text-charcoal">${t.contact.title}</h1>
                <p class="text-sm text-charcoal/70">${t.contact.subtitle}</p>
                <div class="bg-sand p-6 rounded-3xl border border-borderwarm space-y-5 text-sm">
                  <div class="flex items-start gap-3.5">
                    <i data-lucide="map-pin" class="w-5 h-5 text-terracotta shrink-0 mt-0.5"></i>
                    <div>
                      <div class="font-bold">${t.contact.addressTitle}</div>
                      <div class="text-charcoal/75">${t.contact.addressVal}</div>
                    </div>
                  </div>
                  <div class="flex items-start gap-3.5">
                    <i data-lucide="clock" class="w-5 h-5 text-terracotta shrink-0 mt-0.5"></i>
                    <div>
                      <div class="font-bold">${t.contact.hoursTitle}</div>
                      <div class="text-charcoal/75">${t.contact.hoursVal}</div>
                    </div>
                  </div>
                  <div class="flex items-start gap-3.5">
                    <i data-lucide="phone" class="w-5 h-5 text-terracotta shrink-0 mt-0.5"></i>
                    <div>
                      <div class="font-bold">${t.contact.phoneTitle}</div>
                      <div class="text-charcoal/75">+998 71 205 88 99 • +998 90 999 12 34</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="lg:col-span-6">
                <form onsubmit="event.preventDefault(); app.toast('${t.contact.sentMsg}'); this.reset();" class="bg-sand p-8 rounded-3xl border border-borderwarm space-y-4">
                  <h2 class="font-serif text-2xl font-semibold">${t.contact.formTitle}</h2>
                  <input type="text" required placeholder="${t.checkout.fullName}" class="w-full px-4 py-3 rounded-xl bg-cream border border-borderwarm text-sm" />
                  <input type="tel" required value="+998 " oninput="this.value = app.formatPhone(this.value)" class="w-full px-4 py-3 rounded-xl bg-cream border border-borderwarm text-sm font-semibold" />
                  <textarea rows="4" required placeholder="..." class="w-full px-4 py-3 rounded-xl bg-cream border border-borderwarm text-sm"></textarea>
                  <button type="submit" class="w-full py-3.5 rounded-xl bg-charcoal hover:bg-terracotta text-cream text-xs font-bold uppercase tracking-wider transition-colors">
                    ${t.contact.sendBtn}
                  </button>
                </form>
              </div>
            </div>
          </main>
        `;
      },

      // ==========================================
      // VIEW 11: INTERACTIVE FAQ ACCORDION
      // ==========================================
      viewFAQ() {
        const t = this.t();
        return `
          <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-14 space-y-6">
            <h1 class="font-serif text-4xl font-semibold text-charcoal mb-6">${t.faq.title}</h1>
            <div class="space-y-4">
              ${t.faq.items.map((item) => `
                <details class="group bg-sand rounded-2xl border border-borderwarm p-6 cursor-pointer">
                  <summary class="font-serif text-xl font-semibold text-charcoal flex items-center justify-between list-none">
                    <span>${item.q}</span>
                    <i data-lucide="chevron-down" class="w-5 h-5 text-terracotta transition-transform group-open:rotate-180"></i>
                  </summary>
                  <p class="text-sm text-charcoal/75 leading-relaxed mt-3 pt-3 border-t border-borderwarm">${item.a}</p>
                </details>
              `).join('')}
            </div>
          </main>
        `;
      },

      // ==========================================
      // USER ACCOUNT & ORDER HISTORY MODAL
      // ==========================================
      openAuthModal() {
        const modal = document.getElementById('auth-modal-backdrop');
        this.renderAuthModalContent();
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      },

      closeAuthModal() {
        const modal = document.getElementById('auth-modal-backdrop');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      },

      renderAuthModalContent() {
        const t = this.t();
        const container = document.getElementById('auth-modal-content');
        if (this.state.user) {
          container.innerHTML = `
            <div class="space-y-5">
              <h2 class="font-serif text-2xl font-semibold">TOYORA Patron Profile</h2>
              <div class="bg-sand p-4 rounded-2xl border border-borderwarm flex items-center justify-between">
                <div>
                  <div class="font-bold text-sm">${this.state.user.name}</div>
                  <div class="text-xs text-charcoal/65">${this.state.user.phone}</div>
                </div>
                <button onclick="app.state.user=null; app.saveStorage(); app.renderChrome(); app.renderAuthModalContent();" class="text-xs font-bold text-terracotta hover:underline">Sign Out</button>
              </div>
              <div>
                <h3 class="font-serif text-lg font-semibold mb-2">Order History (${this.state.orders.length})</h3>
                ${this.state.orders.length === 0 ? `<p class="text-xs text-charcoal/60">No orders yet.</p>` : `
                  <div class="space-y-2">
                    ${this.state.orders.map((o) => `
                      <div class="p-3 rounded-xl bg-sand border border-borderwarm flex justify-between items-center text-xs">
                        <div>
                          <div class="font-bold text-terracotta">${o.code}</div>
                          <div class="text-charcoal/60">${o.date} • ${o.payment.toUpperCase()}</div>
                        </div>
                        <div class="font-bold">${this.formatUZS(o.total)}</div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="space-y-4">
              <h2 class="font-serif text-2xl font-semibold">TOYORA Patron Club</h2>
              <form onsubmit="event.preventDefault(); app.state.user={name: document.getElementById('auth-name').value, phone: document.getElementById('auth-phone').value}; app.saveStorage(); app.renderChrome(); app.renderAuthModalContent();" class="space-y-3">
                <div>
                  <label class="block text-xs font-bold text-charcoal/70 mb-1">${t.checkout.fullName} *</label>
                  <input id="auth-name" type="text" required class="w-full px-3.5 py-2.5 rounded-xl bg-sand border border-borderwarm text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-charcoal/70 mb-1">${t.checkout.phone} *</label>
                  <input id="auth-phone" type="tel" required value="+998 " oninput="this.value = app.formatPhone(this.value)" class="w-full px-3.5 py-2.5 rounded-xl bg-sand border border-borderwarm text-sm font-semibold" />
                </div>
                <button type="submit" class="w-full py-3.5 rounded-xl bg-charcoal hover:bg-terracotta text-cream text-xs font-bold uppercase tracking-wider">
                  Sign In / Register
                </button>
              </form>
            </div>
          `;
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>
</body>
</html>
