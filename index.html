    let threeHeroCleanup = null;

    function initThreeHero(containerId, isReducedMotion) {
      if (threeHeroCleanup) {
        threeHeroCleanup();
        threeHeroCleanup = null;
      }
      const container = document.getElementById(containerId);
      if (!container || typeof THREE === 'undefined') return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 0.6, 10.5);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      // Warm Atelier Lighting
      const ambient = new THREE.AmbientLight(0xfff8f0, 0.88);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xfffdf9, 1.15);
      keyLight.position.set(6, 10, 8);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0xe8c5c8, 0.65);
      rimLight.position.set(-7, -4, 4);
      scene.add(rimLight);

      // Matte Luxury Materials
      const matWood = new THREE.MeshStandardMaterial({ color: 0xd9b38c, roughness: 0.42, metalness: 0.05 });
      const matDarkWood = new THREE.MeshStandardMaterial({ color: 0x9c6f44, roughness: 0.48, metalness: 0.05 });
      const matTerracotta = new THREE.MeshStandardMaterial({ color: 0xd97757, roughness: 0.35, metalness: 0.04 });
      const matSage = new THREE.MeshStandardMaterial({ color: 0x7e998a, roughness: 0.35, metalness: 0.04 });
      const matBlush = new THREE.MeshStandardMaterial({ color: 0xe8c5c8, roughness: 0.35, metalness: 0.04 });
      const matGold = new THREE.MeshStandardMaterial({ color: 0xf3e5ab, roughness: 0.32, metalness: 0.12 });
      const matCream = new THREE.MeshStandardMaterial({ color: 0xfaf6f0, roughness: 0.3, metalness: 0.05 });

      const interactiveItems = [];

      // 1. Stylized Wooden Toy Roadster (Center-Right)
      const carGroup = new THREE.Group();
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.55, 1.15), matTerracotta);
      carGroup.add(chassis);

      const cabinGeo = new THREE.CylinderGeometry(0.65, 0.85, 1.1, 24, 1, false, 0, Math.PI);
      cabinGeo.rotateZ(Math.PI / 2);
      cabinGeo.rotateY(Math.PI / 2);
      const cabin = new THREE.Mesh(cabinGeo, matWood);
      cabin.position.set(-0.15, 0.25, 0);
      carGroup.add(cabin);

      const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.22, 24);
      wheelGeo.rotateX(Math.PI / 2);
      const hubGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.25, 16);
      hubGeo.rotateX(Math.PI / 2);

      const wheels = [];
      [
        [-0.72, -0.25, 0.62],
        [0.72, -0.25, 0.62],
        [-0.72, -0.25, -0.62],
        [0.72, -0.25, -0.62]
      ].forEach(([wx, wy, wz]) => {
        const w = new THREE.Group();
        w.add(new THREE.Mesh(wheelGeo, matDarkWood));
        w.add(new THREE.Mesh(hubGeo, matCream));
        w.position.set(wx, wy, wz);
        carGroup.add(w);
        wheels.push(w);
      });

      carGroup.position.set(2.2, 0.3, 0.5);
      carGroup.rotation.set(0.18, -0.55, 0.06);
      carGroup.userData = {
        basePos: carGroup.position.clone(),
        speed: 0.9,
        phase: 0.2,
        rotVel: new THREE.Vector3(0.002, 0.004, 0.001)
      };
      scene.add(carGroup);
      interactiveItems.push(carGroup);

      // 2. Montessori Stacking Rings Tower (Left)
      const stacker = new THREE.Group();
      stacker.add(new THREE.Mesh(new THREE.CylinderGeometry(0.95, 1.05, 0.22, 32), matWood));
      const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.9, 16), matWood);
      peg.position.y = 0.95;
      stacker.add(peg);

      [
        { r: 0.72, y: 0.32, m: matSage },
        { r: 0.58, y: 0.68, m: matGold },
        { r: 0.44, y: 1.04, m: matBlush },
        { r: 0.30, y: 1.38, m: matTerracotta }
      ].forEach((s) => {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(s.r, 0.19, 20, 40), s.m);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = s.y;
        stacker.add(ring);
      });
      const topSphere = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 24), matDarkWood);
      topSphere.position.y = 1.82;
      stacker.add(topSphere);

      stacker.position.set(-2.8, -0.5, 0.2);
      stacker.rotation.set(0.25, 0.4, -0.15);
      stacker.userData = {
        basePos: stacker.position.clone(),
        speed: 0.75,
        phase: 1.4,
        rotVel: new THREE.Vector3(0.003, 0.003, 0.002)
      };
      scene.add(stacker);
      interactiveItems.push(stacker);

      // 3. Architectural Toy Block (Top Left)
      const blockGroup = new THREE.Group();
      blockGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.12, 1.12, 1.12), matWood));
      const stud = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 1.2, 24), matSage);
      stud.rotation.x = Math.PI / 2;
      blockGroup.add(stud);
      blockGroup.position.set(-1.4, 2.05, -0.8);
      blockGroup.rotation.set(0.5, 0.6, 0.2);
      blockGroup.userData = {
        basePos: blockGroup.position.clone(),
        speed: 1.05,
        phase: 2.6,
        rotVel: new THREE.Vector3(0.004, 0.004, 0.002)
      };
      scene.add(blockGroup);
      interactiveItems.push(blockGroup);

      // 4. Pastel Rainbow Arch (Top Right)
      const archGroup = new THREE.Group();
      archGroup.add(new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.22, 20, 40, Math.PI), matBlush));
      archGroup.add(new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.2, 20, 40, Math.PI), matGold));
      archGroup.position.set(1.4, 2.2, -1.1);
      archGroup.rotation.set(0.2, -0.3, 0.25);
      archGroup.userData = {
        basePos: archGroup.position.clone(),
        speed: 0.85,
        phase: 3.9,
        rotVel: new THREE.Vector3(0.002, 0.005, 0.002)
      };
      scene.add(archGroup);
      interactiveItems.push(archGroup);

      // 5. Floating Spheres
      [
        { pos: [0.2, -1.75, -0.5], r: 0.4, mat: matGold },
        { pos: [3.5, 1.85, -1.4], r: 0.34, mat: matSage },
        { pos: [-3.7, 1.45, -1.2], r: 0.36, mat: matBlush }
      ].forEach((sp, idx) => {
        const m = new THREE.Mesh(new THREE.SphereGeometry(sp.r, 24, 24), sp.mat);
        m.position.set(...sp.pos);
        m.userData = {
          basePos: m.position.clone(),
          speed: 0.9 + idx * 0.2,
          phase: idx * 1.2,
          rotVel: new THREE.Vector3(0.003, 0.003, 0.003)
        };
        scene.add(m);
        interactiveItems.push(m);
      });

      const targetOffset = new THREE.Vector2(0, 0);
      const raycaster = new THREE.Raycaster();

      const onPointerMove = (e) => {
        const rect = container.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        targetOffset.set(x * 0.55, y * 0.35);
      };

      const onPointerDown = (e) => {
        const rect = container.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(new THREE.Vector2(x, y), camera);
        const hits = raycaster.intersectObjects(interactiveItems, true);
        if (hits.length > 0) {
          let root = hits[0].object;
          while (root.parent && root.parent !== scene) root = root.parent;
          if (root.userData && root.userData.rotVel) {
            root.userData.rotVel.x += 0.06;
            root.userData.rotVel.y += 0.08;
          }
        }
      };

      const onResize = () => {
        if (!container) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      };

      window.addEventListener('pointermove', onPointerMove);
      container.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('resize', onResize);

      let animId;
      const clock = new THREE.Clock();

      const animate = () => {
        animId = requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();

        if (!app.state.reduceMotion) {
          camera.position.x += (targetOffset.x - camera.position.x) * 0.05;
          camera.position.y += (0.6 + targetOffset.y - camera.position.y) * 0.05;
          camera.lookAt(0, 0.2, 0);

          wheels.forEach((w) => { w.rotation.z -= 0.02; });

          interactiveItems.forEach((obj) => {
            const { basePos, speed, phase, rotVel } = obj.userData;
            obj.position.y = basePos.y + Math.sin(elapsed * speed + phase) * 0.24;
            obj.rotation.x += rotVel.x;
            obj.rotation.y += rotVel.y;
            obj.rotation.z += rotVel.z;
            rotVel.x = THREE.MathUtils.lerp(rotVel.x, 0.0025, 0.04);
            rotVel.y = THREE.MathUtils.lerp(rotVel.y, 0.004, 0.04);
          });
        }
        renderer.render(scene, camera);
      };
      animate();

      threeHeroCleanup = () => {
        cancelAnimationFrame(animId);
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('resize', onResize);
        container.removeEventListener('pointerdown', onPointerDown);
        renderer.dispose();
      };
    }

      formatUZS(amount) {
        if (typeof amount !== 'number') return '0 UZS';
        return amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' UZS';
      },

      formatPhone(val) {
        const digits = val.replace(/\D/g, '');
        const clean = digits.startsWith('998') ? digits.slice(3) : digits;
        const d = clean.slice(0, 9);
        if (d.length === 0) return '+998 ';
        if (d.length <= 2) return `+998 ${d}`;
        if (d.length <= 5) return `+998 ${d.slice(0, 2)} ${d.slice(2)}`;
        if (d.length <= 7) return `+998 ${d.slice(0, 2)} ${d.slice(2, 5)} ${d.slice(5)}`;
        return `+998 ${d.slice(0, 2)} ${d.slice(2, 5)} ${d.slice(5, 7)} ${d.slice(7, 9)}`;
      },

      saveStorage() {
        localStorage.setItem('toyora_lang', this.state.lang);

      getCartDetailed() {
        return this.state.cart
          .map((item) => {
            const product = CATALOG.find((p) => p.id === item.id);
            return product ? { ...product, qty: item.qty } : null;
          })
          .filter(Boolean);
      },

        const items = this.getCartDetailed();
        const subtotal = items.reduce((sum, i) => sum + i.price * i.qty, 0);
        const discount = this.state.promoApplied ? Math.round(subtotal * 0.15) : 0;
        let shipping = 0;
        if (subtotal > 0) {
          if (this.state.checkout.method === 'pickup') shipping = 0;
          else if (this.state.checkout.method === 'courier') shipping = subtotal >= 1000000 ? 0 : 40000;
          else shipping = 65000;
        }
        const total = Math.max(0, subtotal - discount + shipping);
        const count = items.reduce((sum, i) => sum + i.qty, 0);
        return { items, subtotal, discount, shipping, total, count };
      },

      addToCart(productId, qty = 1) {
        const existing = this.state.cart.find((i) => i.id === productId);
        if (existing) {
          existing.qty += qty;
        } else {
          this.state.cart.push({ id: productId, qty });
        }
        this.saveStorage();
        this.renderChrome();
        if (this.state.page === 'cart' || this.state.page === 'checkout') {
          this.renderPage();
        }
        const prod = CATALOG.find((p) => p.id === productId);
        this.toast(`${prod ? prod.name[this.state.lang] : ''} — ${this.t().shop.added}`);
      },

      updateCartQty(productId, delta) {
        this.state.cart = this.state.cart
          .map((i) => (i.id === productId ? { ...i, qty: i.qty + delta } : i))
          .filter((i) => i.qty > 0);
        this.saveStorage();
        this.renderChrome();
        this.renderCartDrawer();
        if (this.state.page === 'cart' || this.state.page === 'checkout') {
          this.renderPage();
        }
      },

      removeFromCart(productId) {
        this.state.cart = this.state.cart.filter((i) => i.id !== productId);
        this.saveStorage();
        this.renderChrome();
        this.renderCartDrawer();
        if (this.state.page === 'cart' || this.state.page === 'checkout') {
          this.renderPage();
        }
      },

      applyPromo(code) {
        if (code && code.trim().toUpperCase() === 'TOYORA15') {
          this.state.promoApplied = true;
          this.state.promoMessage = this.t().cart.promoValid;
          this.toast(this.t().cart.promoValid);
        } else {
          this.state.promoMessage = this.t().cart.promoInvalid;
        }
        this.renderCartDrawer();
        if (this.state.page === 'cart' || this.state.page === 'checkout') {
          this.renderPage();
        }
      },

      toggleFavorite(productId) {
        const idx = this.state.favorites.indexOf(productId);
        if (idx > -1) {
          this.state.favorites.splice(idx, 1);
        } else {
          this.state.favorites.push(productId);
        }
        this.saveStorage();
        this.renderChrome();
        this.renderPage();
      },

      toggleCartDrawer(open) {
        const backdrop = document.getElementById('cart-drawer-backdrop');
        if (open) {
          this.renderCartDrawer();
          backdrop.classList.remove('hidden');
          backdrop.classList.add('flex');
        } else {
          backdrop.classList.add('hidden');
          backdrop.classList.remove('flex');
        }
      },

      renderCartDrawer() {
        const t = this.t();
        const { items, subtotal, discount, total, count } = this.getTotals();
        document.getElementById('drawer-cart-title').textContent = `${t.cart.title} (${count})`;

        const itemsEl = document.getElementById('drawer-cart-items');
        const footerEl = document.getElementById('drawer-cart-footer');

        if (items.length === 0) {
          itemsEl.innerHTML = `
            <div class="py-16 text-center space-y-3">
              <p class="font-serif text-xl">${t.cart.empty}</p>
              <p class="text-xs text-charcoal/60">${t.cart.emptyDesc}</p>
            </div>
          `;
          footerEl.innerHTML = '';
        } else {
          itemsEl.innerHTML = items.map((item) => `
            <div class="flex gap-3.5 bg-sand p-3.5 rounded-2xl border border-borderwarm">
              <img src="${item.images[0]}" alt="${item.name[this.state.lang]}" class="w-20 h-20 rounded-xl object-cover shrink-0" />
              <div class="flex-1 min-w-0">
                <h4 class="font-serif text-base font-semibold truncate">${item.name[this.state.lang]}</h4>
                <div class="text-xs font-bold text-terracotta mt-0.5">${this.formatUZS(item.price)}</div>
                <div class="flex items-center justify-between mt-2">
                  <div class="flex items-center bg-cream rounded-lg border border-borderwarm px-2 py-0.5">
                    <button onclick="app.updateCartQty('${item.id}', -1)" class="p-1 hover:text-terracotta"><i data-lucide="minus" class="w-3 h-3"></i></button>
                    <span class="px-2.5 text-xs font-bold">${item.qty}</span>
                    <button onclick="app.updateCartQty('${item.id}', 1)" class="p-1 hover:text-terracotta"><i data-lucide="plus" class="w-3 h-3"></i></button>
                  </div>
                  <button onclick="app.removeFromCart('${item.id}')" class="text-charcoal/50 hover:text-red-600 p-1">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>
          `).join('');

          footerEl.innerHTML = `
            <div class="space-y-4">
              <div class="flex gap-2">
                <input id="drawer-promo-input" type="text" placeholder="${t.cart.promoPlaceholder}" class="flex-1 px-3.5 py-2.5 rounded-xl bg-sand border border-borderwarm text-xs focus:outline-none" />
                <button onclick="app.applyPromo(document.getElementById('drawer-promo-input').value)" class="px-4 py-2.5 rounded-xl bg-charcoal text-cream text-xs font-semibold hover:bg-terracotta transition-colors">${t.cart.apply}</button>
              </div>
              ${this.state.promoMessage ? `<p class="text-xs font-semibold ${this.state.promoApplied ? 'text-sage' : 'text-terracotta'}">${this.state.promoMessage}</p>` : ''}
              <div class="space-y-1.5 text-xs">
                <div class="flex justify-between">
                  <span class="text-charcoal/70">${t.cart.subtotal}</span>
                  <span class="font-semibold">${this.formatUZS(subtotal)}</span>
                </div>
                ${this.state.promoApplied ? `
                <div class="flex justify-between text-sage font-semibold">
                  <span>${t.cart.discount}</span>
                  <span>-${this.formatUZS(discount)}</span>
                </div>` : ''}
                <div class="flex justify-between text-base font-bold pt-2 border-t border-borderwarm">
                  <span>${t.cart.total}</span>
                  <span>${this.formatUZS(total)}</span>
                </div>
              </div>
              <div class="space-y-2">
                <button onclick="app.toggleCartDrawer(false); app.navigate('checkout')" class="w-full py-3.5 rounded-2xl bg-charcoal hover:bg-terracotta text-cream text-xs font-bold uppercase tracking-wider transition-all">${t.cart.checkoutBtn}</button>
                <button onclick="app.toggleCartDrawer(false); app.navigate('cart')" class="w-full py-2.5 rounded-xl border border-borderwarm hover:bg-sand text-xs font-semibold">${t.cart.viewFullCart}</button>
              </div>
            </div>
          `;
        }
        lucide.createIcons();
      },

      // ==========================================
      // HEADER, NAV & FOOTER RENDERING
      // ==========================================
      renderChrome() {
        const t = this.t();
        const { subtotal, count } = this.getTotals();

        // Top Announcement
        document.getElementById('top-announcement-text').textContent = t.announcement;

        // Language Switcher Active State
        document.querySelectorAll('#lang-switcher button').forEach((btn) => {
          const code = btn.getAttribute('data-lang');
          if (code === this.state.lang) {
            btn.className = 'px-2.5 py-1 rounded-full text-[11px] font-bold bg-gold text-charcoal transition-all';
          } else {
            btn.className = 'px-2.5 py-1 rounded-full text-[11px] font-semibold text-cream/80 hover:text-white transition-all';
          }
        });

        // Navigation Items
        const navItems = [
          { id: 'home', label: t.nav.home },
          { id: 'shop', label: t.nav.shop },
          { id: 'categories', label: t.nav.categories },
          { id: 'offers', label: t.nav.offers },
          { id: 'cart', label: t.nav.cart },
          { id: 'about', label: t.nav.about },
          { id: 'contact', label: t.nav.contact },
          { id: 'faq', label: t.nav.faq }
        ];

        document.getElementById('desktop-nav').innerHTML = navItems.map((item) => `
          <button onclick="app.navigate('${item.id}')" class="relative py-1 transition-colors ${this.state.page === item.id ? 'text-terracotta font-bold' : 'text-charcoal hover:text-terracotta'}">
            ${item.label}
            ${this.state.page === item.id ? '<span class="absolute bottom-0 left-0 w-full h-0.5 bg-terracotta rounded-full"></span>' : ''}
          </button>
        `).join('');

        document.getElementById('mobile-menu').innerHTML = navItems.map((item) => `
          <button onclick="app.navigate('${item.id}')" class="block w-full text-left py-2.5 text-sm font-semibold border-b border-borderwarm/50 ${this.state.page === item.id ? 'text-terracotta' : 'text-charcoal'}">
            ${item.label}
          </button>
        `).join('');

        // Badges
        const favBadge = document.getElementById('header-fav-badge');
        if (this.state.favorites.length > 0) {
          favBadge.textContent = this.state.favorites.length;
          favBadge.classList.remove('hidden');
          favBadge.classList.add('flex');
        } else {
          favBadge.classList.add('hidden');
        }

        const userLabel = document.getElementById('header-user-label');
        userLabel.textContent = this.state.user ? this.state.user.name.split(' ')[0] : '';

        document.getElementById('header-cart-total').textContent = this.formatUZS(subtotal);
        document.getElementById('header-cart-count').textContent = count;

        // Footer
        document.getElementById('site-footer').innerHTML = `
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 pb-12 border-b border-white/10">
              <div class="lg:col-span-5 space-y-4">
                <div class="font-serif text-3xl font-bold tracking-[0.16em]">TOYORA</div>
                <p class="text-xs text-cream/75 max-w-sm leading-relaxed">${t.hero.subtitle}</p>
                <div class="text-xs text-gold space-y-1 pt-2">
                  <div>Tashkent Flagship: Amir Temur Avenue 107</div>
                  <div>VIP Concierge: +998 71 205 88 99 • atelier@toyora.uz</div>
                </div>
              </div>
              <div class="lg:col-span-3 space-y-2 text-xs">
                <div class="font-bold uppercase tracking-wider text-gold mb-3">${t.nav.categories}</div>
                ${Object.keys(t.categories.list).map((ck) => `
                  <button onclick="app.navigate('shop', { category: '${ck}' })" class="block text-cream/75 hover:text-white py-1 text-left">
                    ${t.categories.list[ck].name}
                  </button>
                `).join('')}
              </div>
              <div class="lg:col-span-4 space-y-3">
                <h3 class="font-serif text-2xl font-semibold text-gold">${t.footer.newsletterTitle}</h3>
                <p class="text-xs text-cream/75 leading-relaxed">${t.footer.newsletterDesc}</p>
                <form onsubmit="event.preventDefault(); app.toast('${t.footer.subscribed}'); this.reset();" class="flex gap-2 pt-2">
                  <input type="email" required placeholder="${t.footer.placeholder}" class="flex-1 px-4 py-3 rounded-xl bg-white/10 border border-white/15 text-xs text-white placeholder:text-white/50 focus:outline-none" />
                  <button type="submit" class="px-5 py-3 rounded-xl bg-terracotta hover:bg-gold text-white hover:text-charcoal text-xs font-bold uppercase tracking-wider transition-colors">${t.footer.subscribe}</button>
                </form>
              </div>
            </div>
            <div class="pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-cream/60 gap-4">
              <div>© ${new Date().getFullYear()} TOYORA Luxury Toy Boutique. ${t.footer.rights}</div>
              <div class="flex flex-wrap gap-5">
                <span>EN71 Certified</span>
                <span>FSC Hardwood</span>
                <span>Payme • Click • Uzum • Uzcard • Humo</span>
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();
      },

      // ==========================================
      // REUSABLE PRODUCT CARD HTML GENERATOR
      // ==========================================
      renderProductCardHTML(product) {
        const t = this.t();

        const isFav = this.state.favorites.includes(product.id);

        return `
          <div class="group bg-cream rounded-3xl border border-borderwarm overflow-hidden transition-all duration-500 hover:shadow-xl hover:-translate-y-1 flex flex-col">
            <div class="relative aspect-square overflow-hidden bg-sand">
              <img
                src="${product.images[0]}"
                alt="${product.name[lang]}"
                loading="lazy"
                onclick="app.navigate('product', { productId: '${product.id}' })"
                class="w-full h-full object-cover object-center cursor-pointer transition-transform duration-700 group-hover:scale-105"
              />
              <div class="absolute top-3.5 left-3.5 flex flex-col gap-1.5">
                ${product.oldPrice ? `<span class="px-3 py-1 rounded-full text-[11px] font-bold uppercase bg-terracotta text-white shadow-xs">${t.shop.sale}</span>` : ''}

                onclick="app.toggleFavorite('${product.id}')"

              >
                <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-current' : ''}"></i>
              </button>
              <div class="absolute bottom-3 left-3.5">
                <span class="px-3 py-1 rounded-full text-xs font-semibold bg-cream/90 backdrop-blur-md text-charcoal border border-borderwarm">
                  ${ageLabel}
                </span>
              </div>
            </div>
            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between text-xs text-charcoal/60 mb-1.5">
                  <span class="uppercase tracking-wider font-semibold">${catTitle}</span>
                  <span class="flex items-center gap-1 text-terracotta font-bold">
                    <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i> ${product.rating.toFixed(1)}
                  </span>
                </div>
                <h3
                  onclick="app.navigate('product', { productId: '${product.id}' })"
                  class="font-serif text-lg font-semibold text-charcoal group-hover:text-terracotta transition-colors cursor-pointer line-clamp-2 leading-snug mb-2"
                >
                  ${product.name[lang]}
                </h3>
              </div>
              <div class="pt-3 border-t border-borderwarm/60 mt-2">
                <div class="flex items-baseline gap-2 mb-3">
                  <span class="text-base font-bold text-charcoal">${this.formatUZS(product.price)}</span>
                  ${product.oldPrice ? `<span class="text-xs text-charcoal/50 line-through">${this.formatUZS(product.oldPrice)}</span>` : ''}
                </div>
                <button
                  onclick="app.addToCart('${product.id}', 1)"
                  class="w-full py-2.5 px-4 rounded-xl bg-charcoal hover:bg-terracotta text-cream text-xs font-semibold tracking-wider uppercase transition-all flex items-center justify-center gap-2"
                >
                  <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
                  <span>${t.shop.addToCart}</span>
                </button>
              </div>
            </div>
          </div>
        `;
      },

      // ==========================================
      // MASTER ROUTER: RENDER ACTIVE VIEW
      // ==========================================
      renderPage() {
        const view = document.getElementById('app-view');
        const p = this.state.page;

        if (p === 'home') view.innerHTML = this.viewHome();
        else if (p === 'shop') view.innerHTML = this.viewShop();
        else if (p === 'categories') view.innerHTML = this.viewCategories();
        else if (p === 'product') view.innerHTML = this.viewProductDetail();
        else if (p === 'favorites') view.innerHTML = this.viewFavorites();
        else if (p === 'cart') view.innerHTML = this.viewCart();
        else if (p === 'checkout') view.innerHTML = this.viewCheckout();
        else if (p === 'offers') view.innerHTML = this.viewOffers();
        else if (p === 'about') view.innerHTML = this.viewAbout();
        else if (p === 'contact') view.innerHTML = this.viewContact();
        else if (p === 'faq') view.innerHTML = this.viewFAQ();

        lucide.createIcons();

        if (p === 'home') {
          setTimeout(() => initThreeHero('three-hero-canvas', this.state.reduceMotion), 30);
        } else if (threeHeroCleanup) {
          threeHeroCleanup();
          threeHeroCleanup = null;
        }
      },

      // ==========================================
      // VIEW 1: PREMIUM HOMEPAGE
      // ==========================================
      viewHome() {
        const t = this.t();
        const lang = this.state.lang;
        const spotlight = CATALOG[1];

        const giftMatches = CATALOG.filter((p) => {
          const ageMatch = this.state.giftAge === 'all' || p.ageGroup === this.state.giftAge;
          const skillMatch = this.state.giftSkill === 'all' || p.skill === this.state.giftSkill;
          const budgetMatch = p.price <= this.state.giftBudget;
          return ageMatch && skillMatch && budgetMatch;
        });

        return `
          <!-- 3D INTERACTIVE HERO -->
          <section class="relative overflow-hidden bg-gradient-to-b from-sand via-cream to-cream border-b border-borderwarm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:py-16">
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                <!-- Left Copy -->
                <div class="lg:col-span-6 space-y-6 z-10">
                  <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blush/50 border border-terracotta/30 text-xs font-bold tracking-wider uppercase text-charcoal">
                    <i data-lucide="award" class="w-3.5 h-3.5 text-terracotta"></i>
                    <span>${t.hero.badge}</span>
                  </div>
                  <h1 class="font-serif text-4xl sm:text-6xl font-bold text-charcoal leading-[1.08]">
                    ${t.hero.title}
                  </h1>
                  <p class="text-base sm:text-lg text-charcoal/75 leading-relaxed max-w-xl">
                    ${t.hero.subtitle}
                  </p>
                  <div class="flex flex-wrap items-center gap-4 pt-2">
                    <button onclick="app.navigate('shop')" class="px-7 py-4 rounded-2xl bg-charcoal hover:bg-terracotta text-cream text-xs sm:text-sm font-bold tracking-wider uppercase transition-all shadow-lg flex items-center gap-2.5">
                      <span>${t.hero.ctaPrimary}</span>
                      <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                    <a href="#gift-finder-section" class="px-6 py-4 rounded-2xl bg-white/90 hover:bg-white text-charcoal border border-borderwarm text-xs sm:text-sm font-bold tracking-wider uppercase transition-all flex items-center gap-2">
                      <i data-lucide="gift" class="w-4 h-4 text-terracotta"></i>
                      <span>${t.hero.ctaSecondary}</span>
                    </a>
                  </div>
                  <div class="grid grid-cols-3 gap-4 pt-6 border-t border-borderwarm">
                    ${t.hero.metrics.map((m) => `
                      <div>
                        <div class="font-serif text-2xl sm:text-3xl font-bold text-charcoal">${m.val}</div>
                        <div class="text-xs text-charcoal/65 mt-0.5">${m.label}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <!-- Right Interactive Three.js Stage -->
                <div class="lg:col-span-6 relative h-[390px] sm:h-[470px] rounded-3xl bg-gradient-to-br from-sand via-cream to-blush/30 border border-borderwarm shadow-inner overflow-hidden">
                  <div id="three-hero-canvas" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

                  <div class="absolute top-4 left-4 right-4 flex items-center justify-between pointer-events-none">
                    <span class="px-3 py-1.5 rounded-full glass-card text-[11px] font-semibold text-charcoal/80">
                      ${t.hero.interactiveHint}
                    </span>
                    <button id="motion-toggle-btn" onclick="app.toggleMotion()" class="pointer-events-auto px-3 py-1.5 rounded-full glass-card hover:bg-white text-[11px] font-bold text-charcoal flex items-center gap-1.5 shadow-xs">
                      <i data-lucide="pause" class="w-3.5 h-3.5"></i>
                      <span>${t.hero.reduceMotion}</span>
                    </button>
                  </div>

                  <!-- Spotlight Floating Card -->
                  <div class="absolute bottom-4 left-4 right-4 sm:right-auto sm:w-80 glass-card p-3.5 rounded-2xl shadow-lg flex items-center gap-3.5">
                    <img src="${spotlight.images[0]}" alt="${spotlight.name[lang]}" class="w-16 h-16 rounded-xl object-cover shrink-0" />
                    <div class="min-w-0 flex-1">
                      <div class="text-[10px] font-bold uppercase tracking-wider text-terracotta">${t.hero.spotlightTag}</div>
                      <div class="font-serif text-sm font-bold text-charcoal truncate">${spotlight.name[lang]}</div>
                      <div class="text-xs font-bold text-charcoal mt-0.5">${this.formatUZS(spotlight.price)}</div>
                    </div>
                    <button onclick="app.navigate('product', { productId: '${spotlight.id}' })" class="p-2.5 rounded-xl bg-charcoal text-cream hover:bg-terracotta transition-colors">
                      <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- LUXURY MARQUEE RIBBON -->
          <div class="bg-sand border-b border-borderwarm py-3.5 overflow-hidden">
            <div class="animate-marquee flex items-center gap-10 text-xs font-bold uppercase tracking-widest text-charcoal/80">
              ${[...t.marquee, ...t.marquee].map((item) => `
                <span class="inline-flex items-center gap-3">
                  <span class="w-1.5 h-1.5 rounded-full bg-terracotta"></span>
                  <span>${item}</span>
                </span>
              `).join('')}
            </div>
          </div>

          <!-- SHOP BY AGE STAGE -->
          <section class="py-14 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="mb-8">
              <h2 class="font-serif text-3xl sm:text-4xl font-semibold text-charcoal">${t.ages.title}</h2>
              <p class="text-sm text-charcoal/65 mt-1">${t.ages.subtitle}</p>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
              ${Object.keys(t.ages.groups).map((agKey, idx) => {
                const palettes = [
                  'bg-blush/35 border-blush',
                  'bg-sage/20 border-sage/40',
                  'bg-butter/45 border-gold/40',
                  'bg-sand border-borderwarm',
                  'bg-terracotta/15 border-terracotta/30'
                ];
                return `
                  <button onclick="app.navigate('shop', { age: '${agKey}' })" class="p-6 rounded-3xl ${palettes[idx]} border text-left transition-all hover:-translate-y-1 hover:shadow-md flex flex-col justify-between group">
                    <div class="flex items-center justify-between mb-3">
                      <span class="font-serif text-xl sm:text-2xl font-bold text-charcoal">${t.ages.groups[agKey].label}</span>
                      <i data-lucide="chevron-right" class="w-4 h-4 text-charcoal group-hover:translate-x-1 transition-transform"></i>
                    </div>
                    <p class="text-xs text-charcoal/75 leading-relaxed">${t.ages.groups[agKey].desc}</p>
                  </button>
                `;
              }).join('')}
            </div>

      submitReview(e) {
        e.preventDefault();
        const author = document.getElementById('rev-author').value.trim();
        const city = document.getElementById('rev-city').value.trim() || 'Toshkent';
        const rating = Number(document.getElementById('rev-rating').value);
        const productId = document.getElementById('rev-product').value;
        const comment = document.getElementById('rev-comment').value.trim();
        if (!author || !comment) return;

        this.state.reviews.unshift({
          id: 'rev-' + Date.now(),
          author,
          city,
          productId,
          rating,
          comment,
          date: new Date().toISOString().slice(0, 10)
        });
        this.saveStorage();
        this.renderPage();
        this.toast(this.t().reviews.submitBtn);
      },

      // ==========================================
      // VIEW 2: FULL SHOP CATALOG
      // ==========================================
      viewShop() {
        const t = this.t();
        const lang = this.state.lang;

        const filtered = CATALOG.filter((p) => {
          if (this.state.category !== 'all' && p.category !== this.state.category) return false;
          if (this.state.age !== 'all' && p.ageGroup !== this.state.age) return false;
          if (p.price > this.state.maxPrice) return false;
          if (this.state.search.trim() !== '') {
            const q = this.state.search.toLowerCase();
            const matchName = p.name[lang].toLowerCase().includes(q);
            const matchDesc = p.desc[lang].toLowerCase().includes(q);
            if (!matchName && !matchDesc) return false;
          }
          return true;
        }).sort((a, b) => {
          if (this.state.sort === 'price-asc') return a.price - b.price;
          if (this.state.sort === 'price-desc') return b.price - a.price;
          if (this.state.sort === 'rating') return b.rating - a.rating;
          return (b.featured ? 1 : 0) - (a.featured ? 1 : 0);
        });

        return `
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="mb-8">
              <h1 class="font-serif text-4xl font-semibold text-charcoal">${t.shop.title}</h1>
              <p class="text-sm text-charcoal/65 mt-1">${filtered.length} ${t.categories.items}</p>
            </div>

            <!-- Search & Sort Bar -->
            <div class="flex flex-col md:flex-row gap-4 mb-8">
              <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 text-charcoal/50 absolute left-4 top-1/2 -translate-y-1/2"></i>
                <input
                  type="text"
                  value="${this.state.search}"
                  oninput="app.state.search = this.value; app.renderPage();"
                  placeholder="${t.shop.searchPlaceholder}"
                  class="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-sand border border-borderwarm text-sm focus:outline-none focus:border-terracotta"
                />
              </div>
              <div class="flex items-center gap-3">
                <span class="text-xs font-bold uppercase text-charcoal/65">${t.shop.sortBy}:</span>
                <select onchange="app.state.sort = this.value; app.renderPage();" class="px-4 py-3.5 rounded-2xl bg-sand border border-borderwarm text-sm font-semibold">
                  <option value="featured" ${this.state.sort === 'featured' ? 'selected' : ''}>${t.shop.sortFeatured}</option>
                  <option value="price-asc" ${this.state.sort === 'price-asc' ? 'selected' : ''}>${t.shop.sortPriceAsc}</option>
                  <option value="price-desc" ${this.state.sort === 'price-desc' ? 'selected' : ''}>${t.shop.sortPriceDesc}</option>
                  <option value="rating" ${this.state.sort === 'rating' ? 'selected' : ''}>${t.shop.sortRating}</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <!-- Filters Sidebar -->
              <aside class="lg:col-span-3 space-y-6 bg-sand p-6 rounded-3xl border border-borderwarm h-fit">
                <div class="flex items-center justify-between border-b border-borderwarm pb-3">
                  <span class="font-serif text-xl font-semibold">${t.shop.category}</span>
                  <button onclick="app.state.category='all'; app.state.age='all'; app.state.maxPrice=2200000; app.state.search=''; app.renderPage();" class="text-xs font-bold text-terracotta hover:underline">
                    ${t.giftFinder.reset}
                  </button>
                </div>
                <div class="space-y-1.5">
                  <button onclick="app.state.category='all'; app.renderPage();" class="block w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold ${this.state.category === 'all' ? 'bg-charcoal text-cream' : 'hover:bg-cream'}">
                    ${t.shop.allCategories}
                  </button>
                  ${Object.keys(t.categories.list).map((ck) => `
                    <button onclick="app.state.category='${ck}'; app.renderPage();" class="block w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold ${this.state.category === ck ? 'bg-charcoal text-cream' : 'hover:bg-cream'}">
                      ${t.categories.list[ck].name}
                    </button>
                  `).join('')}
                </div>

                <div>
                  <label class="block text-xs font-bold uppercase text-charcoal/70 mb-2">${t.shop.age}</label>
                  <select onchange="app.state.age = this.value; app.renderPage();" class="w-full px-3.5 py-2.5 rounded-xl bg-cream border border-borderwarm text-xs font-semibold">
                    <option value="all" ${this.state.age === 'all' ? 'selected' : ''}>${t.shop.allAges}</option>
                    ${Object.keys(t.ages.groups).map((ak) => `
                      <option value="${ak}" ${this.state.age === ak ? 'selected' : ''}>${t.ages.groups[ak].label}</option>
                    `).join('')}
                  </select>
                </div>

                <div>
                  <div class="flex justify-between text-xs font-bold uppercase text-charcoal/70 mb-1">
                    <span>${t.shop.maxPrice}</span>

                    step="50000"
                    value="${this.state.maxPrice}"

              <!-- Product Grid -->

        const p = CATALOG.find((item) => item.id === this.state.selectedProductId) || CATALOG[0];

        const itemReviews = this.state.reviews.filter((r) => r.productId === p.id);

        return `
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <button onclick="app.navigate('shop')" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-charcoal/65 hover:text-charcoal mb-6">
